version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 7.0.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      github-actions:
        patterns:
          - "*"
