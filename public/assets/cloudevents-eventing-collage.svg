<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Abstract CloudEvents eventing collage</title>
  <desc id="desc">A dark abstract composition of event envelopes, orbiting signals, schema fragments, and shared routing lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070a12" />
      <stop offset="0.5" stop-color="#111827" />
      <stop offset="1" stop-color="#071018" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.38" />
      <stop offset="0.42" stop-color="#f8d36b" stop-opacity="0.12" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="strokeA" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.04" />
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.72" />
      <stop offset="1" stop-color="#f8d36b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="strokeB" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.08" />
      <stop offset="0.52" stop-color="#f8d36b" stop-opacity="0.75" />
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.08" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.91 0 0 0 0 0.95 0 0 0 0.5 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.15" />
      </feComponentTransfer>
    </filter>
    <pattern id="pinGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e5e7eb" fill-opacity="0.09" />
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)" />
  <rect width="1200" height="520" fill="url(#pinGrid)" />
  <rect width="1200" height="520" fill="url(#centerGlow)" />

