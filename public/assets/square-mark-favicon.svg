<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Guanchen oracle core favicon</title>
  <desc id="desc">A bold dark oracle-core logo with nested ochre and teal diamonds.</desc>
  <defs>
    <style>
      .base {
        fill: #0b1010;
      }

      .rim {
        fill: none;
        stroke: #c88a1f;
        stroke-linejoin: miter;
      }

      .core {
        fill: #168f9f;
      }

      .center {
        fill: #f4eadb;
      }

      @media (prefers-color-scheme: light) {
        .base {
          fill: #101918;
        }

        .rim {
          stroke: #7a4d00;
        }

        .core {
          fill: #005e68;
        }
      }
    </style>
  </defs>
  <path class="base" d="M32 0 64 32 32 64 0 32Z" />
  <path class="rim" d="M32 8 56 32 32 56 8 32Z" stroke-width="5.8" />
  <path class="core" d="M32 16 48 32 32 48 16 32Z" />
  <circle class="center" cx="32" cy="32" r="6" />
</svg>