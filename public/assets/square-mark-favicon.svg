<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Guanchen square mark favicon</title>
  <desc id="desc">A minimal solid esoteric logo with an ochre diamond, one teal band, and a central ivory node.</desc>
  <defs>
    <style>
      .mark {
        fill: #c88a1f;
      }

      .stripe {
        fill: #168f9f;
      }

      .node {
        fill: #f4eadb;
      }

      @media (prefers-color-scheme: light) {
        .mark {
          fill: #7a4d00;
        }

        .stripe {
          fill: #005e68;
        }

        .node {
          fill: #f4eadb;
        }
      }
    </style>
    <clipPath id="diamondClip">
      <path d="M32 4 60 32 32 60 4 32Z" />
    </clipPath>
  </defs>
  <path class="mark" d="M32 4 60 32 32 60 4 32Z" />
  <g clip-path="url(#diamondClip)">
    <path class="stripe" d="M8 3 61 56 54 63 1 10Z" />
  </g>
  <path class="node" d="M32 23.5 40.5 32 32 40.5 23.5 32Z" />
</svg>